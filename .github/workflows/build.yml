name: Build and Deploy Tracker
on:
  push:
    branches: [main]
    paths:
      - staging.json
      - build.py
      - tracker_template.html
      # Backlog #27: parser + test changes MUST trigger CI. Without these the test
      # steps below would never run on the very commits most likely to break parsing.
      - parse_fanduel.py
      - add-bet-server/parse_fanduel.py
      - test_*.py
      - parser_baseline.json
      # Corpus pastes: if a paste changes but staging was never re-intaken, the
      # regression test FAILS - which is the alarm we want. This caught 11 bets on
      # 2026-07-29 that were sitting in _paste_0729.txt but missing from the board.
      # After every intake: re-run `python test_parser_regression.py --update` and
      # commit parser_baseline.json alongside staging.json.
      - _paste_*.txt
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # --- TESTS (Backlog #27) -------------------------------------------------
      # Previously CI only built and committed: a parser regression could ship
      # straight to the live board with nothing checking it. Any failure below
      # fails the job, so index.html is never rebuilt from a broken parser.
      - name: Phone path - server parser must match root parser
        run: |
          if ! diff -q parse_fanduel.py add-bet-server/parse_fanduel.py; then
            echo "::error::add-bet-server/parse_fanduel.py has DRIFTED from root parse_fanduel.py"
            diff parse_fanduel.py add-bet-server/parse_fanduel.py || true
            exit 1
          fi
          echo "server parser in sync"
      - name: Gate logic tests
        run: python test_gate.py
      - name: Parser fixture tests (synthetic betslips, all known bug classes)
        run: python test_parser_fixtures.py
      - name: Parser corpus regression (skips if corpus absent - it is untracked)
        run: python test_parser_regression.py
      # --- BUILD ---------------------------------------------------------------
      - name: Build index.html from staging
        run: python build.py staging.json index.html
      - name: Commit rebuilt index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "ci: rebuild index.html from staging [skip ci]"
            git push
          else
            echo "index.html unchanged"
          fi
